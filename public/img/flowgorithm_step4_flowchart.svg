<svg viewBox="0 0 820 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Sarabun', 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow4" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#94a3b8" />
    </marker>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="820" height="460" rx="14" fill="#0f172a"/>

  <!-- Left Side: Complete Flowchart -->
  <g transform="translate(20, 20)">
    <rect width="430" height="420" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="bold">ผังงานตัวอย่าง: ตรวจสอบผลสอบ (Pass / Fail)</text>

    <!-- 1. Start -->
    <rect x="160" y="45" width="110" height="28" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="215" y="64" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Main (เริ่ม)</text>
    <line x1="215" y1="73" x2="215" y2="92" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <!-- 2. Declare -->
    <rect x="145" y="92" width="140" height="28" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="215" y="110" fill="#fef3c7" font-size="10.5" font-weight="bold" text-anchor="middle">Integer score</text>
    <line x1="215" y1="120" x2="215" y2="139" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <!-- 3. Output prompt -->
    <polygon points="135,140 285,140 275,168 125,168" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="205" y="158" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Output: "กรุณากรอกคะแนน:"</text>
    <line x1="205" y1="168" x2="205" y2="187" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <!-- 4. Input -->
    <polygon points="145,188 275,188 265,216 135,216" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="205" y="206" fill="#bfdbfe" font-size="10.5" font-weight="bold" text-anchor="middle">Input: score</text>
    <line x1="205" y1="216" x2="205" y2="238" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <!-- 5. Decision If score >= 50 -->
    <polygon points="205,238 275,263 205,288 135,263" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="205" y="261" fill="#ffe4e6" font-size="10" font-weight="bold" text-anchor="middle">score &gt;= 50</text>
    <text x="205" y="274" fill="#f43f5e" font-size="8.5" text-anchor="middle">เงื่อนไขผ่านเกณฑ์</text>

    <!-- Branch True (Right) -->
    <line x1="275" y1="263" x2="335" y2="263" stroke="#10b981" stroke-width="1.5"/>
    <line x1="335" y1="263" x2="335" y2="295" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow4)"/>
    <text x="295" y="256" fill="#34d399" font-size="9.5" font-weight="bold">True (จริง)</text>
    
    <polygon points="275,295 405,295 395,325 265,325" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="335" y="314" fill="#a7f3d0" font-size="9.5" font-weight="bold" text-anchor="middle">Output: "สอบผ่าน 🎉"</text>

    <!-- Branch False (Left) -->
    <line x1="135" y1="263" x2="75" y2="263" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="75" y1="263" x2="75" y2="295" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow4)"/>
    <text x="90" y="256" fill="#f87171" font-size="9.5" font-weight="bold">False (เท็จ)</text>

    <polygon points="20,295 145,295 135,325 10,325" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="77" y="314" fill="#fecaca" font-size="9.5" font-weight="bold" text-anchor="middle">Output: "สอบไม่ผ่าน 💡"</text>

    <!-- Merge to End -->
    <line x1="75" y1="325" x2="75" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="335" y1="325" x2="335" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="75" y1="350" x2="205" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="335" y1="350" x2="205" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="205" y1="350" x2="205" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow4)"/>

    <!-- End -->
    <rect x="160" y="370" width="110" height="28" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="215" y="389" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">End (จบ)</text>
  </g>

  <!-- Right Side: Console Window & Variables Watch -->
  <g transform="translate(470, 20)">
    <!-- Console Window -->
    <rect width="330" height="240" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="330" height="30" rx="10" fill="#065f46"/>
    <rect y="20" width="330" height="10" fill="#065f46"/>
    <text x="15" y="21" fill="#ffffff" font-size="12" font-weight="bold">🖥️ หน้าต่างคอนโซล (Console Window)</text>

    <text x="20" y="60" fill="#94a3b8" font-size="11.5">--- เริ่มต้นการทำงานของโปรแกรม ---</text>
    <text x="20" y="85" fill="#34d399" font-size="12">กรุณากรอกคะแนน:</text>
    
    <!-- User Input simulation -->
    <rect x="20" y="98" width="130" height="26" rx="4" fill="#1e293b" stroke="#38bdf8"/>
    <text x="28" y="116" fill="#38bdf8" font-size="13" font-weight="bold">75 <tspan fill="#f59e0b" font-weight="normal">↵ (กด Enter)</tspan></text>

    <text x="20" y="150" fill="#6ee7b7" font-size="13" font-weight="bold">สอบผ่าน 🎉</text>
    <text x="20" y="175" fill="#94a3b8" font-size="11.5">--- โปรแกรมทำงานสิ้นสุดเรียบร้อย ---</text>

    <rect x="20" y="195" width="290" height="30" rx="6" fill="#1e293b"/>
    <text x="165" y="215" fill="#38bdf8" font-size="11" text-anchor="middle">▶ กดปุ่ม Run เพื่อทดสอบค่าคะแนนอื่นได้ทันที</text>

    <!-- Variables Watch Window -->
    <g transform="translate(0, 260)">
      <rect width="330" height="160" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="330" height="28" rx="10" fill="#1d4ed8"/>
      <rect y="18" width="330" height="10" fill="#1d4ed8"/>
      <text x="15" y="19" fill="#ffffff" font-size="11.5" font-weight="bold">🔍 หน้าต่างตัวแปร (Variable Watch)</text>

      <rect x="15" y="38" width="300" height="24" fill="#0f172a"/>
      <text x="25" y="54" fill="#94a3b8" font-size="11" font-weight="bold">ชื่อตัวแปร</text>
      <text x="130" y="54" fill="#94a3b8" font-size="11" font-weight="bold">ชนิดข้อมูล</text>
      <text x="235" y="54" fill="#94a3b8" font-size="11" font-weight="bold">ค่าปัจจุบัน</text>

      <rect x="15" y="65" width="300" height="26" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="82" fill="#38bdf8" font-size="12" font-weight="bold">score</text>
      <text x="130" y="82" fill="#fbbf24" font-size="11.5">Integer</text>
      <text x="235" y="82" fill="#34d399" font-size="13" font-weight="bold">75</text>

      <text x="165" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">เห็นค่าตัวแปรอัปเดตแบบเรียลไทม์ขณะรัน!</text>
    </g>
  </g>
</svg>