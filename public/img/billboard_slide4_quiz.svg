<svg viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:auto; font-family:'Kanit',sans-serif;">
  <defs>
    <filter id="shadow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="grad-trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Disc -->
  <circle cx="100" cy="100" r="90" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Quiz Test Paper Floating -->
  <g transform="translate(32, 45)">
    <rect x="0" y="0" width="62" height="85" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-rose)"/>
    <rect x="8" y="10" width="46" height="6" rx="3" fill="#dc2626"/>
    <circle cx="12" cy="28" r="4" fill="#107548"/>
    <rect x="20" y="26" width="34" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="12" cy="42" r="4" fill="#107548"/>
    <rect x="20" y="40" width="34" height="4" rx="2" fill="#cbd5e1"/>
    <circle cx="12" cy="56" r="4" fill="#107548"/>
    <rect x="20" y="54" width="34" height="4" rx="2" fill="#cbd5e1"/>
    
    <!-- Score Badge: 100% -->
    <rect x="12" y="68" width="38" height="11" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="31" y="76" font-size="6.5" font-weight="800" fill="#107548" text-anchor="middle">Score 100%</text>
  </g>

  <!-- Golden Champion Trophy -->
  <g transform="translate(98, 38)" filter="url(#shadow-rose)">
    <!-- Cup Body -->
    <path d="M12,18 h44 v20 a22,22 0 0,1 -44,0 z" fill="url(#grad-trophy)" stroke="#ffffff" stroke-width="2"/>
    <!-- Cup Handles -->
    <path d="M12,24 h-6 a7,7 0 0,0 0,14 h6" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <path d="M56,24 h6 a7,7 0 0,1 0,14 h-6" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    <!-- Stem and Base -->
    <rect x="30" y="48" width="8" height="16" fill="#b45309"/>
    <polygon points="20,64 48,64 52,72 16,72" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Star on Trophy -->
    <path d="M34,24 l2,5 h5 l-4,3 l2,5 l-5,-3 l-5,3 l2,-5 l-4,-3 h5 z" fill="#ffffff"/>

    <!-- Rank 1 Badge on Base -->
    <circle cx="34" cy="72" r="7" fill="#fbbf24"/>
    <text x="34" y="75" font-size="8" font-weight="900" fill="#0f172a" text-anchor="middle">1</text>
  </g>

  <!-- Floating Stars -->
  <polygon points="148,32 150,37 155,37 151,40 153,45 148,42 143,45 145,40 141,37 146,37" fill="#fbbf24"/>
  <polygon points="32,32 33,35 37,35 34,37 35,40 32,38 29,40 30,37 27,35 31,35" fill="#f59e0b"/>
</svg>