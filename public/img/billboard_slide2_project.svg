<svg viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:auto; font-family:'Kanit',sans-serif;">
  <defs>
    <filter id="shadow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d97706" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad-binder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#107548"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Disc -->
  <circle cx="100" cy="100" r="90" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Project Book Binder (เล่มโครงงาน 5 บท) -->
  <g transform="translate(42, 35)">
    <!-- Book Shadow -->
    <rect x="5" y="5" width="85" height="115" rx="6" fill="#cbd5e1" opacity="0.4"/>
    <!-- Book Cover -->
    <rect x="0" y="0" width="85" height="115" rx="6" fill="url(#grad-binder)" stroke="#ffffff" stroke-width="2" filter="url(#shadow-amber)"/>
    <!-- Spine Line -->
    <line x1="14" y1="0" x2="14" y2="115" stroke="#fef3c7" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="7" cy="20" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="7" cy="58" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="7" cy="95" r="2.5" fill="#ffffff" opacity="0.7"/>
    <!-- Book Title & 5 Chapters Badge -->
    <rect x="22" y="16" width="55" height="20" rx="4" fill="#ffffff"/>
    <text x="49" y="29" font-size="7.5" font-weight="800" fill="#b45309" text-anchor="middle">รายงานโครงงาน</text>
    <text x="49" y="34" font-size="5" font-weight="700" fill="#64748b" text-anchor="middle">5 บทฉบับสมบูรณ์</text>
    
    <!-- Content Lines / Gantt Simulation inside book -->
    <rect x="22" y="44" width="48" height="4" rx="2" fill="#fde68a"/>
    <rect x="22" y="52" width="36" height="4" rx="2" fill="#fde68a"/>
    <rect x="22" y="60" width="52" height="4" rx="2" fill="#fde68a"/>
    <rect x="22" y="68" width="42" height="4" rx="2" fill="#fde68a"/>

    <!-- Gold Seal / Badge at bottom right of book -->
    <circle cx="58" cy="92" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="58" y="96" font-size="9" font-weight="900" fill="#d97706" text-anchor="middle">5</text>
  </g>

  <!-- Document / Proposal Sheet Floating -->
  <g transform="translate(108, 50)">
    <rect x="0" y="0" width="55" height="72" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-amber)"/>
    <rect x="8" y="10" width="39" height="5" rx="2.5" fill="#0284c7"/>
    <rect x="8" y="20" width="34" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="8" y="26" width="39" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="8" y="32" width="28" height="3" rx="1.5" fill="#cbd5e1"/>
    
    <!-- Checkmark Badge -->
    <circle cx="38" cy="54" r="9" fill="#107548"/>
    <path d="M34,54 l3,3 l6,-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Cloud Upload Badge (ส่งงานออนไลน์) -->
  <g transform="translate(108, 128)" filter="url(#shadow-amber)">
    <rect x="-8" y="-12" width="68" height="36" rx="18" fill="url(#grad-cloud)" stroke="#ffffff" stroke-width="2"/>
    <path d="M12,-2 a8,8 0 0,1 15,-2 a6,6 0 0,1 11,5 a5,5 0 0,1 -2,7 h-24 a5,5 0 0,1 0,-10 z" fill="#ffffff"/>
    <!-- Upload Arrow -->
    <path d="M26,9 v-8 m-3,3 l3,-3 l3,3" fill="none" stroke="#107548" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>