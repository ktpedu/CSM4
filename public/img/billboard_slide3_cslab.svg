<svg viewBox="0 0 200 200" width="160" height="160" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:auto; font-family:'Kanit',sans-serif;">
  <defs>
    <filter id="shadow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Disc -->
  <circle cx="100" cy="100" r="90" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Code Screen / Laptop Window -->
  <g transform="translate(25, 40)">
    <rect x="0" y="0" width="150" height="96" rx="8" fill="url(#grad-screen)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow-cyan)"/>
    <!-- Window Bar -->
    <rect x="0" y="0" width="150" height="18" rx="8" fill="#1e293b"/>
    <circle cx="12" cy="9" r="3" fill="#ef4444"/>
    <circle cx="20" cy="9" r="3" fill="#f59e0b"/>
    <circle cx="28" cy="9" r="3" fill="#10b981"/>
    <text x="75" y="12" font-size="7.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Flowgorithm &amp; CS Lab</text>

    <!-- Inside Screen: Flowchart Simulation -->
    <!-- Start Oval -->
    <rect x="55" y="24" width="40" height="12" rx="6" fill="#10b981"/>
    <text x="75" y="33" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">Start</text>
    <line x1="75" y1="36" x2="75" y2="43" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Decision Diamond -->
    <polygon points="75,43 96,54 75,65 54,54" fill="#f59e0b"/>
    <text x="75" y="56" font-size="6.5" font-weight="700" fill="#0f172a" text-anchor="middle">x &gt; 0 ?</text>
    <line x1="75" y1="65" x2="75" y2="72" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Process Box -->
    <rect x="52" y="72" width="46" height="13" rx="3" fill="#0284c7"/>
    <text x="75" y="81" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">Output Result</text>

    <!-- Left/Right decorative branches -->
    <line x1="96" y1="54" x2="118" y2="54" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="118" y1="54" x2="118" y2="78" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="105" y="78" width="26" height="10" rx="2" fill="#64748b"/>
    <text x="118" y="85" font-size="5" fill="#ffffff" text-anchor="middle">False</text>
  </g>

  <!-- Science Flask / Interactive Lab Gear Badge -->
  <g transform="translate(136, 118)" filter="url(#shadow-cyan)">
    <circle cx="18" cy="18" r="22" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M14,8 h8 v6 l8,14 a3,3 0 0,1 -2,4 h-20 a3,3 0 0,1 -2,-4 l8,-14 z" fill="#ffffff"/>
    <circle cx="18" cy="24" r="2" fill="#0284c7"/>
    <circle cx="14" cy="28" r="1.5" fill="#0284c7"/>
    <circle cx="21" cy="27" r="1" fill="#0284c7"/>
  </g>
</svg>