<svg viewBox="0 0 800 380" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Sarabun', 'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="380" rx="14" fill="url(#bgGrad5)"/>

  <!-- Left: Source Code Viewer (Python Conversion) -->
  <g transform="translate(30, 25)">
    <rect width="360" height="330" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="360" height="34" rx="10" fill="#0284c7"/>
    <rect y="24" width="360" height="10" fill="#0284c7"/>
    <text x="18" y="22" fill="#ffffff" font-size="12.5" font-weight="bold">⚡ หน้าต่างแปลงโค้ด (Source Code Viewer)</text>

    <!-- Language selector in app -->
    <rect x="15" y="44" width="330" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="64" fill="#94a3b8" font-size="11.5">ภาษาที่แปลง: <tspan fill="#38bdf8" font-weight="bold">Python 3 ▾</tspan> (เลือก C++, Java ได้)</text>

    <!-- Python Code Box -->
    <rect x="15" y="82" width="330" height="225" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="30" y="108" fill="#a1a1aa" font-size="11" font-family="monospace"># แปลงจาก Flowgorithm อัตโนมัติ</text>
    <text x="30" y="132" fill="#f43f5e" font-size="12" font-family="monospace">print<tspan fill="#fef08a">("กรุณากรอกคะแนน:")</tspan></text>
    <text x="30" y="156" fill="#38bdf8" font-size="12" font-family="monospace">score = int<tspan fill="#ffffff">(input())</tspan></text>
    
    <text x="30" y="185" fill="#c084fc" font-size="12" font-family="monospace">if <tspan fill="#ffffff">score &gt;= </tspan><tspan fill="#38bdf8">50</tspan><tspan fill="#ffffff">:</tspan></text>
    <text x="55" y="209" fill="#f43f5e" font-size="12" font-family="monospace">print<tspan fill="#fef08a">("สอบผ่าน 🎉")</tspan></text>
    <text x="30" y="233" fill="#c084fc" font-size="12" font-family="monospace">else:</text>
    <text x="55" y="257" fill="#f43f5e" font-size="12" font-family="monospace">print<tspan fill="#fef08a">("สอบไม่ผ่าน 💡")</tspan></text>

    <text x="180" y="295" fill="#34d399" font-size="11" text-anchor="middle">✓ ช่วยให้นักเรียนเข้าใจความเชื่อมโยงของผังงานกับโค้ดจริง</text>
  </g>

  <!-- Right: Export Image for Homework & Project Report -->
  <g transform="translate(415, 25)">
    <rect width="355" height="330" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="355" height="34" rx="10" fill="#059669"/>
    <rect y="24" width="355" height="10" fill="#059669"/>
    <text x="18" y="22" fill="#ffffff" font-size="12.5" font-weight="bold">📸 การบันทึกและ Export รูปภาพเพื่อส่งงาน</text>

    <rect x="20" y="50" width="315" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="75" fill="#38bdf8" font-size="13" font-weight="bold">1. บันทึกไฟล์โปรแกรม (.fprg)</text>
    <text x="35" y="96" fill="#94a3b8" font-size="11.5">• ไปที่เมนู <tspan fill="#f8fafc" font-weight="bold">File -&gt; Save As...</tspan></text>
    <text x="35" y="116" fill="#94a3b8" font-size="11.5">• ได้ไฟล์นามสกุล <tspan fill="#34d399" font-weight="bold">.fprg</tspan> เก็บไว้ในเครื่อง</text>
    <text x="35" y="136" fill="#94a3b8" font-size="11.5">• ใช้ส่งให้ครูตรวจ หรือเปิดแก้ไขในคาบถัดไป</text>

    <rect x="20" y="172" width="315" height="135" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="197" fill="#34d399" font-size="13" font-weight="bold">2. Export เป็นรูปภาพ (.PNG / .SVG)</text>
    <text x="35" y="218" fill="#94a3b8" font-size="11.5">• ไปที่เมนู <tspan fill="#f8fafc" font-weight="bold">Tools -&gt; Export to Image / Vector</tspan></text>
    <text x="35" y="238" fill="#94a3b8" font-size="11.5">• เลือกรูปแบบภาพ: <tspan fill="#38bdf8" font-weight="bold">PNG (.png)</tspan> คมชัดสูง</text>
    <text x="35" y="258" fill="#94a3b8" font-size="11.5">• นำภาพไปแนบลงใน <tspan fill="#fbbf24" font-weight="bold">ใบงาน ม.4</tspan> หรือ <tspan fill="#fbbf24" font-weight="bold">เล่มโครงงาน 5 บท</tspan></text>
    <text x="35" y="278" fill="#94a3b8" font-size="11.5">• ภาพพื้นหลังโปร่งใส นำไปวางใน Word/Canva สวยงาม</text>
  </g>
</svg>