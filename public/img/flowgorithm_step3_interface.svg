<svg viewBox="0 0 820 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Sarabun', 'Segoe UI', sans-serif;">
  <defs>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Flowgorithm Main App Window -->
  <rect x="15" y="15" width="790" height="430" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="15" y="15" width="790" height="36" rx="12" fill="#0f172a"/>
  <rect x="15" y="40" width="790" height="11" fill="#0f172a"/>
  <circle cx="36" cy="33" r="5" fill="#ef4444"/>
  <circle cx="52" cy="33" r="5" fill="#f59e0b"/>
  <circle cx="68" cy="33" r="5" fill="#10b981"/>
  <text x="410" y="38" fill="#94a3b8" font-size="12" text-anchor="middle">Flowgorithm - [ตัวอย่างผังงานคำนวณผลสอบ.fprg]</text>

  <!-- Toolbar -->
  <rect x="15" y="51" width="790" height="42" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Run controls -->
  <rect x="30" y="59" width="32" height="26" rx="4" fill="#10b981"/>
  <text x="46" y="77" fill="#ffffff" font-size="12" text-anchor="middle">▶</text>
  
  <rect x="68" y="59" width="32" height="26" rx="4" fill="#0284c7"/>
  <text x="84" y="77" fill="#ffffff" font-size="12" text-anchor="middle">⏩</text>

  <rect x="106" y="59" width="32" height="26" rx="4" fill="#64748b"/>
  <text x="122" y="77" fill="#ffffff" font-size="12" text-anchor="middle">⏸</text>

  <rect x="144" y="59" width="32" height="26" rx="4" fill="#ef4444"/>
  <text x="160" y="76" fill="#ffffff" font-size="10" text-anchor="middle">⏹</text>

  <!-- Speed control label -->
  <text x="195" y="76" fill="#94a3b8" font-size="11">ความเร็วรัน:</text>
  <line x1="250" y1="72" x2="330" y2="72" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="290" cy="72" r="6" fill="#38bdf8"/>
  <text x="340" y="76" fill="#94a3b8" font-size="11">🐢 ── 🐇</text>

  <!-- Tools on right -->
  <rect x="580" y="59" width="95" height="26" rx="4" fill="#334155"/>
  <text x="627" y="76" fill="#38bdf8" font-size="11" text-anchor="middle">ดูโค้ด (Code)</text>

  <rect x="685" y="59" width="105" height="26" rx="4" fill="#334155"/>
  <text x="737" y="76" fill="#34d399" font-size="11" text-anchor="middle">หน้าจอ (Console)</text>

  <!-- Workspace Canvas (Center-Left) -->
  <rect x="30" y="105" width="410" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="45" y="128" fill="#64748b" font-size="12" font-weight="bold">พื้นที่ออกแบบผังงาน (Flowchart Canvas)</text>

  <!-- Canvas flow demonstration -->
  <!-- Main Start -->
  <rect x="175" y="145" width="120" height="32" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="235" y="166" fill="#bfdbfe" font-size="13" font-weight="bold" text-anchor="middle">Main (เริ่มต้น)</text>
  <line x1="235" y1="177" x2="235" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="231,200 235,208 239,200" fill="#94a3b8"/>

  <!-- Click spot (Double click to add shape) -->
  <g transform="translate(195, 210)">
    <circle cx="40" cy="12" r="14" fill="#e11d48" filter="url(#shadow3)"/>
    <text x="40" y="18" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">+</text>
    <rect x="-70" y="32" width="220" height="24" rx="4" fill="#4c0519" stroke="#f43f5e"/>
    <text x="40" y="48" fill="#fecdd3" font-size="10.5" font-weight="bold" text-anchor="middle">ดับเบิลคลิกเส้นลูกศร เพื่อเพิ่มคำสั่ง</text>
  </g>

  <line x1="235" y1="268" x2="235" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="231,290 235,298 239,290" fill="#94a3b8"/>

  <!-- End -->
  <rect x="175" y="300" width="120" height="32" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="235" y="321" fill="#bfdbfe" font-size="13" font-weight="bold" text-anchor="middle">End (สิ้นสุด)</text>


  <!-- Right: Shapes Palette (เมนูเลือกสัญลักษณ์) -->
  <g transform="translate(460, 105)">
    <rect width="330" height="320" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect width="330" height="32" rx="8" fill="#0369a1"/>
    <rect y="22" width="330" height="10" fill="#0369a1"/>
    <text x="15" y="22" fill="#ffffff" font-size="12.5" font-weight="bold">เมนูเลือกคำสั่งผังงาน (Insert Shape)</text>

    <!-- Group 1: I/O & Variables -->
    <text x="15" y="52" fill="#38bdf8" font-size="11" font-weight="bold">ตัวแปร &amp; การรับส่งข้อมูล</text>
    
    <!-- Declare -->
    <rect x="15" y="60" width="145" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="25" y="78" fill="#fbbf24" font-size="11" font-weight="bold">Declare (ประกาศตัวแปร)</text>
    <text x="25" y="93" fill="#94a3b8" font-size="9.5">กำหนดชื่อ &amp; ชนิดข้อมูล</text>

    <!-- Assign -->
    <rect x="170" y="60" width="145" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="180" y="78" fill="#fbbf24" font-size="11" font-weight="bold">Assign (กำหนดค่า)</text>
    <text x="180" y="93" fill="#94a3b8" font-size="9.5">คำนวณหรือใส่ค่าให้ตัวแปร</text>

    <!-- Input -->
    <rect x="15" y="112" width="145" height="42" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="130" fill="#60a5fa" font-size="11" font-weight="bold">Input (รับข้อมูลเข้า)</text>
    <text x="25" y="145" fill="#94a3b8" font-size="9.5">รับค่าจากคีย์บอร์ด</text>

    <!-- Output -->
    <rect x="170" y="112" width="145" height="42" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="130" fill="#34d399" font-size="11" font-weight="bold">Output (แสดงผลลัพธ์)</text>
    <text x="180" y="145" fill="#94a3b8" font-size="9.5">แสดงข้อความออกหน้าจอ</text>

    <!-- Group 2: Control & Loops -->
    <text x="15" y="178" fill="#38bdf8" font-size="11" font-weight="bold">โครงสร้างเงื่อนไข &amp; การวนซ้ำ</text>

    <!-- If Decision -->
    <rect x="15" y="188" width="145" height="42" rx="6" fill="#1e293b" stroke="#e11d48" stroke-width="1.5"/>
    <text x="25" y="206" fill="#f43f5e" font-size="11" font-weight="bold">If (เงื่อนไขการตัดสินใจ)</text>
    <text x="25" y="221" fill="#94a3b8" font-size="9.5">แยกทาง True / False</text>

    <!-- While Loop -->
    <rect x="170" y="188" width="145" height="42" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="180" y="206" fill="#a78bfa" font-size="11" font-weight="bold">While (วนซ้ำแบบตรวจสอบ)</text>
    <text x="180" y="221" fill="#94a3b8" font-size="9.5">ทำซ้ำขณะเงื่อนไขเป็นจริง</text>

    <!-- For Loop -->
    <rect x="15" y="238" width="145" height="42" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="25" y="256" fill="#a78bfa" font-size="11" font-weight="bold">For (วนซ้ำตามรอบนับ)</text>
    <text x="25" y="271" fill="#94a3b8" font-size="9.5">กำหนดจำนวนรอบแน่นอน</text>

    <!-- Comment -->
    <rect x="170" y="238" width="145" height="42" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="180" y="256" fill="#cbd5e1" font-size="11" font-weight="bold">Comment (คำอธิบาย)</text>
    <text x="180" y="271" fill="#94a3b8" font-size="9.5">เขียนโน้ตกำกับคำสั่ง</text>

    <text x="165" y="304" fill="#94a3b8" font-size="10.5" text-anchor="middle">💡 คลิกเลือกคำสั่งที่ต้องการ แล้วใส่ชื่อตัวแปรหรือข้อความ</text>
  </g>
</svg>